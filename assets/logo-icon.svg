<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 115" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <linearGradient id="goldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="sunGradIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadowIcon" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Golden Crest -->
  <path d="M55 5 C94 5 106 20 106 50 C106 90 62 112 55 114 C48 112 4 90 4 50 C4 20 16 5 55 5 Z"
        fill="url(#goldGradIcon)" filter="url(#shadowIcon)" />

  <!-- Dojo Midnight Rim -->
  <path d="M55 8 C89 8 101 21 101 50 C101 84 60 107 55 109 C50 107 9 84 9 50 C9 21 21 8 55 8 Z"
        fill="#0F172A" />

  <!-- Inner Crimson Shield -->
  <path d="M55 12 C85 12 95 24 95 51 C95 80 59 102 55 104 C51 102 15 80 15 51 C15 24 25 12 55 12 Z"
        fill="url(#shieldGradIcon)" />

  <!-- Rising Sun Halo -->
  <circle cx="55" cy="50" r="30" fill="url(#sunGradIcon)" opacity="0.65" />
  <path d="M55 22 L55 78 M27 50 L83 50 M35 30 L75 70 M35 70 L75 30" stroke="#FEF08A" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Martial Arts Kid Silhouette (Flying Kick) -->
  <circle cx="47" cy="33" r="6.5" fill="#FFFFFF" />
  <path d="M44 34 Q36 33 31 38 M44 36 Q38 38 32 44" stroke="#FEF08A" stroke-width="2.2" stroke-linecap="round" />

  <!-- Karate Gi -->
  <path d="M45 40 L53 43 L52 56 L43 55 Z" fill="#FFFFFF" />
  <path d="M48 42 L47 55" stroke="#CBD5E1" stroke-width="1.2" />

  <!-- Guard Fist -->
  <path d="M46 42 L37 45 L37 40" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="37" cy="40" r="2.5" fill="#FEF08A" />

  <!-- Back Fist -->
  <path d="M52 43 L62 39 L68 42" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- High Side Kick Leg -->
  <path d="M50 54 L61 50 L78 42" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M78 42 L82 37 L86 42 L81 46 Z" fill="#FEF08A" />

  <!-- Chambered Leg -->
  <path d="M44 55 L38 64 L46 68" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Black Belt -->
  <path d="M42 54 C46 55 50 55 53 54" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
  <path d="M46 55 L42 70 M49 55 L52 72" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  <circle cx="43" cy="67" r="1.5" fill="#F59E0B" />
  <circle cx="50" cy="69" r="1.5" fill="#F59E0B" />

  <!-- Energy Arc -->
  <path d="M25 67 C30 82 72 84 86 56" stroke="#FEF08A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- 3 Confidence Stars -->
  <polygon points="38,18 39.5,21 43,21.5 40.5,24 41,27 38,25.5 35,27 35.5,24 33,21.5 36.5,21" fill="url(#goldGradIcon)" />
  <polygon points="55,12 57,16 62,16.5 58.5,20 59.5,24.5 55,22 50.5,24.5 51.5,20 48,16.5 53,16" fill="url(#goldGradIcon)" />
  <polygon points="72,18 73.5,21 77,21.5 74.5,24 75,27 72,25.5 69,27 69.5,24 67,21.5 70.5,21" fill="url(#goldGradIcon)" />
</svg>

<!DOCTYPE html>
<html lang="en" class="dark" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Student Registration - Kids Martial Arts &amp; Confidence Building Program</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />
  <link rel="shortcut icon" href="assets/logo-icon.svg" />
  <link rel="apple-touch-icon" href="assets/logo-icon.svg" />

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6.5.1 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              crimson: '#E11D48',
              crimsonDark: '#9F1239',
              fire: '#FF385C',
              gold: '#F59E0B',
              goldLight: '#FDE047',
              navy: '#0F172A',
              slate: '#1E293B',
              darkBg: '#080B11',
              darkCard: '#111726',
              lightBg: '#F8FAFC',
              lightCard: '#FFFFFF'
            }
          },
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Motion (Official Framer Motion Engine) -->
  <script src="https://cdn.jsdelivr.net/npm/motion@11.11.17/dist/motion.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      min-height: 100vh;
      width: 100%; max-width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: clip;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Scrollbar styling */
    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none;
      width: 0px;
      height: 0px;
    }
    html, body {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    body {
      transition: background-color 0.3s ease, color 0.3s ease;
      background-color: #080B11;
    }

    html:not(.dark) body {
      background-color: #F8FAFC;
    }

    /* Ambient Subtle Dots Pattern */
    .bg-grid-ambient {
      background-size: 32px 32px;
      background-image: 
        radial-gradient(circle, rgba(225, 29, 72, 0.08) 1px, transparent 1px);
    }
    .dark .bg-grid-ambient {
      background-image: 
        radial-gradient(circle, rgba(245, 158, 11, 0.07) 1px, transparent 1px);
    }

    /* Glassmorphism Card */
    .login-glass-card {
      background: rgba(13, 19, 31, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 
        0 20px 50px -10px rgba(0, 0, 0, 0.8),
        0 0 35px -8px rgba(245, 158, 11, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    html:not(.dark) .login-glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(226, 232, 240, 0.95);
      box-shadow: 
        0 20px 50px -10px rgba(15, 23, 42, 0.12),
        0 0 25px -8px rgba(225, 29, 72, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    /* Glowing Gold Action Button */
    .btn-gold-glow {
      background: linear-gradient(180deg, #FDE047 0%, #F59E0B 50%, #D97706 100%);
      color: #0F172A;
      font-weight: 800;
      box-shadow: 
        0 3px 0 #92400E,
        0 8px 20px -3px rgba(245, 158, 11, 0.45);
      border-top: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-gold-glow:hover {
      transform: translateY(-1.5px);
      box-shadow: 
        0 4.5px 0 #92400E,
        0 12px 24px -3px rgba(245, 158, 11, 0.6);
    }
    .btn-gold-glow:active {
      transform: translateY(1.5px);
      box-shadow: 
        0 1.5px 0 #92400E,
        0 4px 12px -3px rgba(245, 158, 11, 0.4);
    }

    /* 3D Toggle Buttons */
    .btn-3d-switch {
      background: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%);
      border: 1px solid #CBD5E1;
      box-shadow: 0 1.5px 0 #94A3B8, 0 2px 4px rgba(0,0,0,0.06);
      transition: all 0.15s ease;
    }
    .dark .btn-3d-switch {
      background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);
      border: 1px solid #334155;
      box-shadow: 0 1.5px 0 #020617, 0 2px 4px rgba(0,0,0,0.4);
    }
    .btn-3d-switch:hover {
      transform: translateY(-1px);
    }
    .btn-3d-switch:active {
      transform: translateY(1px);
    }

    /* Social Auth Buttons */
    .btn-social-auth {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.18s ease;
    }
    html:not(.dark) .btn-social-auth {
      background: rgba(241, 245, 249, 0.85);
      border: 1px solid rgba(203, 213, 225, 0.85);
    }
    .btn-social-auth:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(245, 158, 11, 0.35);
      transform: translateY(-1px);
    }
    html:not(.dark) .btn-social-auth:hover {
      background: rgba(226, 232, 240, 1);
      border-color: rgba(225, 29, 72, 0.35);
    }

    /* Floating Martial Ember Particle Animation */
    @keyframes floatingEmber {
      0% {
        transform: translateY(0px) rotate(0deg) scale(1);
        opacity: 0.2;
      }
      50% {
        transform: translateY(-20px) rotate(180deg) scale(1.15);
        opacity: 0.7;
      }
      100% {
        transform: translateY(0px) rotate(360deg) scale(1);
        opacity: 0.2;
      }
    }
    .floating-ember {
      animation: floatingEmber 7s ease-in-out infinite;
      pointer-events: none;
    }
    .floating-ember-reverse {
      animation: floatingEmber 9s ease-in-out infinite reverse;
      pointer-events: none;
    }
  

    /* ==========================================================================
       ENTERPRISE MOBILE-FIRST RESPONSIVE MASTER STYLESHEET
       Strict mobile optimization for 320px, 480px, 768px, 1024px
       Zero horizontal overflow | Adaptive typography | Fluid grid & flex layout
       ========================================================================== */

    /* 1. Global Box-Sizing & Overflow Quarantine */
    *, *::before, *::after {
      box-sizing: border-box !important;
    }

    html {
      width: 100% !important;
      max-width: 100% !important;
      overflow-x: hidden;
      overflow-x: clip !important;
      -webkit-text-size-adjust: 100%;
    }

    body {
      width: 100% !important;
      max-width: 100% !important;
      overflow-x: clip !important;
      position: relative !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Guaranteed Persistent Sticky Navbar Across All Screen Sizes */
    #mainHeader,
    header {
      position: -webkit-sticky !important;
      position: sticky !important;
      top: 0 !important;
      z-index: 50 !important;
    }

    /* 2. Media & Visual Elements Strict Fluid Bounds */
    img, svg, video, canvas, audio, iframe, embed, object {
      max-width: 100% !important;
      height: auto;
    }

    /* 3. Text Overflow Immunity */
    h1, h2, h3, h4, h5, h6, p, span, a, button, li, dt, dd, blockquote, label {
      overflow-wrap: break-word !important;
      word-wrap: break-word !important;
      max-width: 100%;
    }

    /* 4. Section & Container Strict Layout Integrity */
    section {
      width: 100% !important;
      max-width: 100% !important;
      position: relative !important;
      overflow-x: hidden;
      overflow-x: clip !important;
      overflow-y: visible !important;
    }

    .container, .max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl, .max-w-3xl, .max-w-2xl {
      width: 100% !important;
      max-width: 100% !important;
    }

    /* 5. Responsive Form Controls & Interactive Buttons */
    input, select, textarea {
      max-width: 100% !important;
    }

    button, a.btn-3d, .btn-3d {
      max-width: 100% !important;
      white-space: normal;
    }

    /* 6. Breakpoint Optimization: <= 1024px (Small Laptops & Tablets) */
    @media (max-width: 1024px) {
      .max-w-7xl, .max-w-6xl {
        padding-left: 1.5rem !important;
        padding-right: 1.5rem !important;
      }
      header nav, header {
        max-width: 100% !important;
      }
    }

    /* 7. Breakpoint Optimization: <= 768px (Tablets & Mobile Landscape) */
    @media (max-width: 768px) {
      /* Fluid Headings */
      h1, .text-5xl, .text-6xl, .text-7xl {
        font-size: clamp(1.85rem, 5.5vw, 2.75rem) !important;
        line-height: 1.15 !important;
      }
      h2, .text-3xl, .text-4xl {
        font-size: clamp(1.4rem, 4.2vw, 2.1rem) !important;
        line-height: 1.22 !important;
      }
      h3, .text-2xl {
        font-size: clamp(1.2rem, 3.2vw, 1.55rem) !important;
        line-height: 1.28 !important;
      }

      /* Consistent Section Spacing */
      section {
        padding-top: clamp(2.5rem, 6vw, 4rem) !important;
        padding-bottom: clamp(2.5rem, 6vw, 4rem) !important;
      }

      /* Stack two-column split heroes & banners */
      .grid.lg\:grid-cols-2, .grid.lg\:grid-cols-3, .grid.lg\:grid-cols-4 {
        grid-template-columns: repeat(1, minmax(0, 1fr)) !important;
      }
    }

    /* 8. Breakpoint Optimization: <= 480px (Standard Mobile Portrait) */
    @media (max-width: 480px) {
      /* Uniform padding on all main containers */
      .px-4, .px-6, .px-8, .sm\:px-6, .lg\:px-8 {
        padding-left: 1rem !important;
        padding-right: 1rem !important;
      }

      /* Mobile Adaptive Typography */
      h1, .text-5xl, .text-6xl, .text-7xl {
        font-size: clamp(1.55rem, 7vw, 2.15rem) !important;
        line-height: 1.18 !important;
      }
      h2, .text-3xl, .text-4xl {
        font-size: clamp(1.3rem, 5.2vw, 1.7rem) !important;
        line-height: 1.25 !important;
      }
      h3, .text-2xl {
        font-size: clamp(1.1rem, 4vw, 1.35rem) !important;
        line-height: 1.3 !important;
      }
      p, .text-base, .text-lg {
        font-size: 0.925rem !important;
        line-height: 1.55 !important;
      }

      /* Stack card grids vertically on mobile */
      .grid.sm\:grid-cols-2,
      .grid.sm\:grid-cols-3,
      .grid.sm\:grid-cols-4,
      .grid.md\:grid-cols-2,
      .grid.md\:grid-cols-3 {
        grid-template-columns: repeat(1, minmax(0, 1fr)) !important;
      }

      /* Full width buttons in CTAs */
      .flex.flex-wrap.items-center.gap-3 > button,
      .flex.flex-wrap.items-center.gap-3 > a.btn-3d,
      .hero-btn-group > * {
        width: 100% !important;
        justify-content: center !important;
        text-align: center !important;
      }

      /* Modals fit comfortably */
      #loginModalContent, .modal-content {
        width: 95% !important;
        max-width: 95% !important;
        padding: 1.25rem !important;
      }

      /* Mobile drawer fits without overflow */
      #mobileDrawer {
        width: min(85vw, 290px) !important;
      }
    }

    /* 9. Breakpoint Optimization: <= 320px (Small Screen / iPhone SE) */
    @media (max-width: 320px) {
      .px-4, .px-6, .px-8, .sm\:px-6, .lg\:px-8 {
        padding-left: 0.75rem !important;
        padding-right: 0.75rem !important;
      }

      /* Ultra-compact Typography */
      h1, .text-5xl, .text-6xl, .text-7xl {
        font-size: 1.4rem !important;
        line-height: 1.2 !important;
      }
      h2, .text-3xl, .text-4xl {
        font-size: 1.2rem !important;
        line-height: 1.22 !important;
      }
      h3, .text-2xl {
        font-size: 1.05rem !important;
      }
      body, p, .text-base {
        font-size: 0.85rem !important;
      }
      .text-sm {
        font-size: 0.8rem !important;
      }
      .text-xs {
        font-size: 0.7rem !important;
      }

      /* Compact Buttons */
      .btn-3d {
        padding-left: 0.65rem !important;
        padding-right: 0.65rem !important;
        font-size: 0.75rem !important;
      }

      /* Force all multi-col grids to 1 col (except drawer inline buttons) */
      .grid-cols-2, .grid-cols-3, .grid-cols-4, .grid-cols-5, .grid-cols-6 {
        grid-template-columns: repeat(1, minmax(0, 1fr)) !important;
      }
      #mobileDrawer .grid-cols-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      }
    }

  </style>
</head>

<body class="text-slate-800 dark:text-slate-100 min-h-screen w-screen flex items-center justify-center relative overflow-x-hidden p-3 sm:p-4 bg-grid-ambient select-none">

  <!-- Ambient Glow Orbs -->
  <div class="fixed top-8 left-8 w-80 h-80 bg-rose-500/10 dark:bg-rose-500/12 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-8 right-8 w-80 h-80 bg-amber-500/10 dark:bg-amber-500/12 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Ambient Sparkling Embers in Background -->
  <div class="fixed top-[18%] left-[10%] w-2 h-2 rounded-full bg-amber-400/40 floating-ember"></div>
  <div class="fixed top-[32%] right-[14%] w-2.5 h-2.5 rounded-full bg-amber-300/50 floating-ember-reverse"></div>
  <div class="fixed bottom-[24%] left-[16%] w-1.5 h-1.5 rounded-full bg-rose-400/35 floating-ember"></div>
  <div class="fixed bottom-[14%] right-[20%] w-2.5 h-2.5 rounded-full bg-amber-400/45 floating-ember-reverse"></div>

  <!-- TOP-RIGHT FLOATING CONTROLS (RTL & THEME ONLY) -->
  <div class="fixed top-3.5 right-4 sm:top-5 sm:right-6 rtl:right-auto rtl:left-4 rtl:sm:left-6 flex items-center gap-2 z-30">
    <button id="rtlToggleBtn" onclick="toggleRTL()" class="btn-3d btn-3d-switch w-8 h-8 rounded-xl flex items-center justify-center text-xs" title="Toggle RTL / LTR" aria-label="Toggle RTL">
      <i id="rtlIcon" class="fa-solid fa-right-left text-[11px] text-brand-crimson"></i>
    </button>
    <button id="themeToggleBtn" onclick="toggleTheme()" class="btn-3d btn-3d-switch w-8 h-8 rounded-xl flex items-center justify-center text-xs" title="Toggle Dark/Light Mode" aria-label="Toggle theme">
      <i id="themeIcon" class="fa-solid fa-sun text-amber-400"></i>
    </button>
  </div>

  <!-- CENTERED REGISTRATION CARD -->
  <main class="w-full max-w-[430px] my-auto py-6 relative z-20">
    <div id="regCard" class="login-glass-card rounded-[26px] p-5 sm:p-6 text-left rtl:text-right space-y-3.5">

      <!-- 1. EXACT NAVBAR LOGO FROM INDEX.HTML -->
      <div class="flex items-center justify-center pb-0.5">
        <a href="index.html" id="brandLogo" class="group flex items-center gap-2 shrink-0 focus:outline-none" aria-label="Kids Martial Arts & Confidence Building Program">
          
          <!-- Compact Shield Logo Emblem (~28px) with Spring Hover -->
          <div id="logoIconContainer" class="relative w-7 h-7 sm:w-7.5 sm:h-7.5 rounded-lg bg-gradient-to-b from-rose-500 via-brand-crimson to-rose-700 p-0.5 shadow-sm shadow-rose-950/20 shrink-0 cursor-pointer">
            <div class="w-full h-full bg-slate-950 rounded-[5px] flex items-center justify-center overflow-hidden relative">
              <div class="absolute inset-0 bg-radial-gradient from-amber-400/25 to-transparent"></div>
              
              <!-- Clean Scaled Vector Emblem -->
              <svg viewBox="0 0 100 100" class="w-5 h-5 sm:w-5.5 sm:h-5.5 text-white" fill="none">
                <circle cx="50" cy="50" r="26" fill="#F59E0B" fill-opacity="0.2" />
                <!-- 3 Top Stars -->
                <polygon points="34,16 35.5,19 39,19.5 36.5,22 37,25 34,23.5 31,25 31.5,22 29,19.5 32.5,19" fill="#FDE047" />
                <polygon points="50,11 52,15 57,15.5 53.5,19 54.5,23.5 50,21 45.5,23.5 46.5,19 43,15.5 48,15" fill="#FDE047" />
                <polygon points="66,16 67.5,19 71,19.5 68.5,22 69,25 66,23.5 63,25 63.5,22 61,19.5 64.5,19" fill="#FDE047" />
                <!-- Kicking Martial Artist Silhouette -->
                <circle cx="43" cy="30" r="6" fill="#FFFFFF" />
                <path d="M40 31 Q33 30 28 35" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
                <path d="M41 36 L48 39 L47 52 L39 51 Z" fill="#FFFFFF" />
                <path d="M42 38 L34 41" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
                <path d="M47 39 L57 35 L62 38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
                <path d="M45 50 L56 46 L73 39" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
                <path d="M73 39 L76 34 L80 39 L75 42 Z" fill="#FDE047" />
                <path d="M40 51 L35 59 L42 63" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
                <path d="M38 50 C42 51 46 51 48 50" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" />
                <path d="M42 51 L38 65 M44 51 L47 67" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
                <circle cx="39" cy="62" r="1.2" fill="#F59E0B" />
                <circle cx="45" cy="64" r="1.2" fill="#F59E0B" />
              </svg>
            </div>
            
            <div class="absolute -top-1 -right-1 rtl:-left-1 rtl:-right-auto w-3 h-3 rounded-full bg-amber-400 border border-slate-950 flex items-center justify-center text-[6px] font-black text-slate-950">
              ★
            </div>
          </div>

          <!-- Delicate Compact Typography -->
          <div class="flex flex-col text-left rtl:text-right">
            <span class="font-outfit font-black text-xs sm:text-[13.5px] tracking-tight leading-none text-slate-900 dark:text-white group-hover:text-brand-crimson transition-colors">
              <span class="text-brand-crimson">KIDS</span> MARTIAL ARTS
            </span>
            <span class="text-[7.5px] sm:text-[8px] font-bold text-amber-500 dark:text-amber-400 tracking-wider uppercase font-outfit leading-tight mt-0.5">
              &amp; CONFIDENCE BUILDING PROGRAM
            </span>
          </div>
        </a>
      </div>

      <!-- 2. REGISTRATION FORM -->
      <form id="portalRegForm" onsubmit="handlePortalRegistration(event)" class="space-y-2.5">
        
        <!-- Field 1: Student Name -->
        <div class="space-y-1">
          <label for="studentNameInput" class="block text-xs font-bold text-slate-700 dark:text-slate-300">
            Student / Child&apos;s Full Name
          </label>
          <input 
            type="text" 
            id="studentNameInput" 
            required 
            placeholder="e.g. Leo Jenkins"
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950/70 border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all"
          />
        </div>

        <!-- Field 2: Parent Email -->
        <div class="space-y-1">
          <label for="parentEmailInput" class="block text-xs font-bold text-slate-700 dark:text-slate-300">
            Parent / Guardian Email
          </label>
          <input 
            type="email" 
            id="parentEmailInput" 
            required 
            placeholder="e.g. parent@example.com"
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950/70 border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all"
          />
        </div>

        <!-- Field 3: Age & Program Track -->
        <div class="space-y-1">
          <label for="programTrackSelect" class="block text-xs font-bold text-slate-700 dark:text-slate-300">
            Program Track &amp; Age Group
          </label>
          <select 
            id="programTrackSelect" 
            required
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950/70 border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all cursor-pointer"
          >
            <option value="little-warriors">Little Warriors (Ages 3–5)</option>
            <option value="white-belt" selected>Foundations: White Belt (Ages 6–8)</option>
            <option value="yellow-orange">Junior Core: Yellow &amp; Orange (Ages 9–11)</option>
            <option value="leadership">Teens &amp; Leadership (Ages 12+)</option>
          </select>
        </div>

        <!-- Field 4: Password -->
        <div class="space-y-1">
          <label for="regPasswordInput" class="block text-xs font-bold text-slate-700 dark:text-slate-300">
            Create Portal Password
          </label>
          <div class="relative">
            <input 
              type="password" 
              id="regPasswordInput" 
              required 
              placeholder="Create strong password"
              class="w-full px-3.5 py-2.5 pr-10 rtl:pr-3.5 rtl:pl-10 rounded-xl bg-slate-100 dark:bg-slate-950/70 border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all"
            />
            <button 
              type="button" 
              onclick="toggleRegPasswordVisibility()" 
              id="regPasswordEyeBtn"
              class="absolute right-3 rtl:right-auto rtl:left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors focus:outline-none p-1"
              title="Show or hide password"
              aria-label="Toggle password visibility"
            >
              <i id="regPasswordEyeIcon" class="fa-regular fa-eye text-xs"></i>
            </button>
          </div>
        </div>

        <!-- Agreement Checkbox -->
        <div class="pt-1">
          <label class="flex items-start gap-2 cursor-pointer select-none">
            <input 
              type="checkbox" 
              required
              class="w-3.5 h-3.5 mt-0.5 rounded text-amber-500 focus:ring-amber-500/40 bg-slate-100 dark:bg-slate-950 border-slate-300 dark:border-slate-700 accent-amber-500 cursor-pointer"
            />
            <span class="text-[11px] text-slate-600 dark:text-slate-400 leading-snug">
              I agree to the <a href="about.html" class="font-bold text-amber-500 hover:underline">Dojo Code of Conduct</a> &amp; safety policies.
            </span>
          </label>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="regSubmitBtn"
          class="btn-gold-glow w-full py-2.5 sm:py-3 rounded-2xl text-xs sm:text-sm flex items-center justify-center gap-2 cursor-pointer mt-1"
        >
          <span>Complete Student Registration</span>
          <i class="fa-solid fa-arrow-right rtl:rotate-180 text-xs"></i>
        </button>

      </form>

      <!-- 3. DIVIDER: OR REGISTER WITH -->
      <div class="relative flex items-center justify-center py-0.5">
        <div class="w-full border-t border-slate-200 dark:border-slate-800"></div>
        <span class="absolute px-2.5 bg-white/95 dark:bg-[#0D131F] text-[9px] font-black uppercase tracking-widest text-slate-400 dark:text-slate-500">
          OR REGISTER WITH
        </span>
      </div>

      <!-- 4. SOCIAL AUTHENTICATION -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        <button type="button" onclick="handleSocialRegister('Google')" class="btn-social-auth py-2 rounded-xl flex items-center justify-center transition-all cursor-pointer" title="Sign up with Google" aria-label="Google">
          <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
        </button>

        <button type="button" onclick="handleSocialRegister('Facebook')" class="btn-social-auth py-2 rounded-xl flex items-center justify-center transition-all text-blue-500 cursor-pointer" title="Sign up with Facebook" aria-label="Facebook">
          <i class="fa-brands fa-facebook-f text-xs"></i>
        </button>

        <button type="button" onclick="handleSocialRegister('Apple')" class="btn-social-auth py-2 rounded-xl flex items-center justify-center transition-all text-slate-800 dark:text-white cursor-pointer" title="Sign up with Apple" aria-label="Apple">
          <i class="fa-brands fa-apple text-sm"></i>
        </button>
      </div>

      <!-- 5. I ALREADY HAVE AN ACCOUNT (REDIRECT TO INDEX.HTML) -->
      <div class="text-center pt-0.5">
        <a 
          href="index.html" 
          onclick="window.location.href='index.html'; return false;"
          id="alreadyAccountBtn"
          class="w-full py-2.5 rounded-2xl border border-slate-300 dark:border-slate-800/80 bg-slate-100/60 dark:bg-slate-950/40 hover:bg-slate-200 dark:hover:bg-slate-900 text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 transition-all flex items-center justify-center gap-1.5 group cursor-pointer"
        >
          <span>I already have an account</span>
          <i class="fa-solid fa-arrow-right rtl:rotate-180 text-xs text-brand-crimson group-hover:translate-x-1 rtl:group-hover:-translate-x-1 transition-transform"></i>
        </a>
      </div>

      <!-- 6. SECURITY BADGE -->
      <div class="flex items-center justify-center gap-1.5 text-[10.5px] font-bold text-slate-500 dark:text-slate-400 pt-0.5">
        <i class="fa-solid fa-shield-halved text-emerald-500 text-xs"></i>
        <span>256-Bit SSL Encrypted &amp; Dojo Safe Portal</span>
      </div>

    </div>
  </main>

  <!-- SCRIPTS -->
  <script>
    function initTheme() {
      const saved = localStorage.getItem('theme');
      const html = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      
      if (saved === 'light') {
        html.classList.remove('dark');
        if (themeIcon) {
          themeIcon.classList.remove('fa-sun', 'text-amber-400');
          themeIcon.classList.add('fa-moon', 'text-slate-700');
        }
      } else {
        html.classList.add('dark');
        if (themeIcon) {
          themeIcon.classList.remove('fa-moon', 'text-slate-700');
          themeIcon.classList.add('fa-sun', 'text-amber-400');
        }
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      const isDark = html.classList.contains('dark');

      if (isDark) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        if (themeIcon) {
          themeIcon.classList.remove('fa-sun', 'text-amber-400');
          themeIcon.classList.add('fa-moon', 'text-slate-700');
        }
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        if (themeIcon) {
          themeIcon.classList.remove('fa-moon', 'text-slate-700');
          themeIcon.classList.add('fa-sun', 'text-amber-400');
        }
      }

      if (window.Motion && window.Motion.animate && themeIcon) {
        window.Motion.animate(themeIcon, 
          { rotate: [0, 360], scale: [0.75, 1.2, 1] }, 
          { duration: 0.35, easing: window.Motion.spring({ stiffness: 450, damping: 20 }) }
        );
      }
    }

    function initRTL() {
      const saved = localStorage.getItem('direction');
      const html = document.documentElement;
      if (saved === 'rtl') {
        html.setAttribute('dir', 'rtl');
      } else {
        html.setAttribute('dir', 'ltr');
      }
    }

    function toggleRTL() {
      const html = document.documentElement;
      const current = html.getAttribute('dir');
      const next = current === 'rtl' ? 'ltr' : 'rtl';
      html.setAttribute('dir', next);
      localStorage.setItem('direction', next);

      const icon = document.getElementById('rtlIcon');
      if (window.Motion && window.Motion.animate && icon) {
        window.Motion.animate(icon, 
          { scale: [0.8, 1.25, 1], rotate: [0, 180] }, 
          { duration: 0.3, easing: window.Motion.spring({ stiffness: 500, damping: 22 }) }
        );
      }
    }

    function toggleRegPasswordVisibility() {
      const input = document.getElementById('regPasswordInput');
      const icon = document.getElementById('regPasswordEyeIcon');
      if (!input || !icon) return;

      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash', 'text-amber-500');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash', 'text-amber-500');
        icon.classList.add('fa-eye');
      }

      if (window.Motion && window.Motion.animate) {
        window.Motion.animate(icon, { scale: [0.7, 1.25, 1] }, { duration: 0.25 });
      }
    }

    function handlePortalRegistration(e) {
      e.preventDefault();
      const studentName = document.getElementById('studentNameInput').value;
      const submitBtn = document.getElementById('regSubmitBtn');
      
      if (submitBtn) {
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>Enrolling Student...</span>';
        submitBtn.disabled = true;
      }

      setTimeout(() => {
        alert('Registration Successful! Welcome to the Dojo, ' + studentName + '. Please log in to view your belt progress tracker.');
        window.location.href = 'login.html';
      }, 950);
    }

    function handleSocialRegister(provider) {
      alert('Connecting to ' + provider + ' Registration Service...');
    }

    function initRegMotion() {
      if (!window.Motion || !window.Motion.animate) return;
      const { animate, spring } = window.Motion;

      const card = document.getElementById('regCard');
      if (card) {
        animate(card, 
          { scale: [0.93, 1], y: [18, 0], opacity: [0, 1] }, 
          { duration: 0.55, easing: spring({ stiffness: 380, damping: 25 }) }
        );
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initRTL();
      initRegMotion();

      // Ensure direct redirect to index.html
      const alreadyBtn = document.getElementById('alreadyAccountBtn');
      if (alreadyBtn) {
        alreadyBtn.addEventListener('click', (e) => {
          e.preventDefault();
          window.location.href = 'index.html';
        });
      }
    });
  </script>

</body>
</html>
